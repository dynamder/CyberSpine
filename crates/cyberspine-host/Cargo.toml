[package]
name = "cyberspine-host"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license.workspace = true

# The host-side half of the interrupt boundary: no CLI, no terminal, no clock.
# `cyinevm` and the maze example both drive the same loop through this crate.

[dependencies]
cyberspine-arbiter = { path = "../cyberspine-arbiter" }
cyberspine-core = { path = "../cyberspine-core" }
cyberspine-vm = { path = "../cyberspine-vm" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"

[dev-dependencies]
cyberspine-testkit = { path = "../cyberspine-testkit" }
