[package]
name = "cyberspine-asm"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license.workspace = true

[dependencies]
winnow = "1.0.4"
cyberspine-core = { path = "../cyberspine-core" }
cyberspine-diag = { path = "../cyberspine-diag" }
cyberspine-manifest = { path = "../cyberspine-manifest" }
cyberspine-store = { path = "../cyberspine-store" }
clap = { version = "4.6.7", features = ["derive"] }
thiserror = "2.0.21"
smol_str = "0.3.6"
annotate-snippets = "0.12.17"

[[bin]]
name = "cyinea"
path = "src/main.rs"

[dev-dependencies]
cyberspine-testkit = { path = "../cyberspine-testkit" }
cyberspine-vm = { path = "../cyberspine-vm" }
