[package]
name = "cyberspine-plugin"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license.workspace = true

# A plugin crosses a boundary at run time. The two packagings share everything
# below the message types, so `dylib` and `rpc` are dependency edges here just as
# they are in the crates that wrap this one.
[features]
default = []
dylib = ["dep:libloading"]
rpc = ["dep:tokio"]

[dependencies]
cyberspine-frame = { path = "../cyberspine-frame" }
libloading = { version = "0.9", optional = true }
thiserror = "2.0.21"
tokio = { version = "1.54", optional = true, features = ["io-util", "net", "rt", "time"] }
