[package]
name = "cyberspine-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license.workspace = true

[dependencies]
# `default-features = false` is what makes blake3 build without std: `std` is the
# crate's only default feature, and hash verification (binfmt §9.1 C6) has to run
# on a bare-metal target. This crate is `#![no_std]` unconditionally — it has no
# `std` feature, so "does it link on a microcontroller" is a compile-time fact
# rather than a configuration choice.
blake3 = { version = "1.8.7", default-features = false }
thiserror = { version = "2.0.21", default-features = false }

[dev-dependencies]
# The integration tests under `tests/` are ordinary std crates: they hash bytes
# themselves, so they use the default (std) build of blake3.
blake3 = "1.8.7"
