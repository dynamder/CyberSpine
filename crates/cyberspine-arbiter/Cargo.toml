[package]
name = "cyberspine-arbiter"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license.workspace = true

# The same feature edges the backend uses: a host that only loads shared
# libraries does not compile a runtime, and a plugin author takes `export` alone.
[features]
default = []
dylib = ["dep:libloading"]
rpc = ["dep:tokio"]
export = []

[dependencies]
cyberspine-frame = { path = "../cyberspine-frame" }
libloading = { version = "0.9", optional = true }
rmp-serde = "1.3.1"
serde = { version = "1", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.54", optional = true, features = ["io-util", "net", "rt", "time"] }

[dev-dependencies]
cyberspine-arbiter-fixture = { path = "../cyberspine-arbiter-fixture" }
serde_json = "1"
