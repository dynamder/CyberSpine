[package]
name = "cyberspine-arbiter"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license.workspace = true

# The same feature edges the backend uses: a host that only loads shared
# libraries does not compile a runtime, and a plugin author takes `export` alone.
# The loaders and the transport loops are `cyberspine-plugin`'s.
[features]
default = []
dylib = ["cyberspine-plugin/dylib"]
rpc = ["cyberspine-plugin/rpc"]
export = []

[dependencies]
cyberspine-diag = { path = "../cyberspine-diag" }
cyberspine-frame = { path = "../cyberspine-frame" }
cyberspine-plugin = { path = "../cyberspine-plugin" }
rmp-serde = "1.3.1"
serde = { version = "1", features = ["derive"] }
thiserror = "2.0.21"

[dev-dependencies]
cyberspine-arbiter-fixture = { path = "../cyberspine-arbiter-fixture" }
cyberspine-testkit = { path = "../cyberspine-testkit" }
serde_json = "1"
