name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # Mirrors `rust-toolchain.toml`: a moving `stable` turns a Rust release
      # into an unrelated red build.
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
          targets: thumbv7em-none-eabihf

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --no-deps -- -D warnings

      # The reason the split exists: the portable crates must be usable on a
      # microcontroller. `cargo test` compiles them for the host, where a stray
      # `std` call would still build, so this is the only check that notices.
      - name: no_std (cyberspine-isa, thumbv7em)
        run: cargo check -p cyberspine-isa --target thumbv7em-none-eabihf

      - name: no_std (cyberspine-rig, thumbv7em)
        run: cargo check -p cyberspine-rig --target thumbv7em-none-eabihf

      - name: no_std (cyberspine-binfmt, thumbv7em)
        run: cargo check -p cyberspine-binfmt --target thumbv7em-none-eabihf

      - name: no_std (cyberspine-exec, thumbv7em)
        run: cargo check -p cyberspine-exec --target thumbv7em-none-eabihf

      - name: no_std (cyberspine-core, thumbv7em)
        run: cargo check -p cyberspine-core --target thumbv7em-none-eabihf

      # `fuzz/` is its own workspace and is not covered by `--workspace`.
      - name: test (all platforms)
        run: cargo test --workspace --all-targets

      # The runtime's external backends are features. This build has neither,
      # so the tests that pin the "not compiled" message run here.
      - name: test (runtime without external backends)
        run: cargo test -p cyberspine-runtime --no-default-features

      - name: clippy (runtime without external backends)
        run: cargo clippy -p cyberspine-runtime --no-default-features --all-targets --no-deps -- -D warnings

      # `cyberspine-backend`'s transports are feature-gated, so the workspace run
      # above compiles only the wire and remote layers. This one loads a real
      # shared library and opens a real socket.
      - name: test (backend integrations)
        run: cargo test -p cyberspine-backend --all-features

      - name: clippy (backend integrations)
        run: cargo clippy -p cyberspine-backend --all-features --all-targets --no-deps -- -D warnings

      # The two tools the project ships: assemble a real source, then run the
      # image against the built-in linked dummy body.
      - name: tools (assemble + run)
        run: |
          cargo run --release -p cyberspine-asm -- -a demos/maze/maze.csa -o target/maze.csp
          cargo run --release -p cyberspine-runtime -- -i target/maze.csp --ticks 5 --unpaced

  # The `rust-version` every manifest declares, checked against a real compiler
  # instead of trusted. The `+` overrides `rust-toolchain.toml`, which pins the
  # build toolchain for every other job.
  msrv:
    name: msrv (1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          targets: thumbv7em-none-eabihf

      - name: workspace
        run: cargo +1.89.0 check --workspace --all-targets --locked

      # `firmware/` is its own workspace with its own lockfile.
      - name: firmware
        working-directory: firmware
        run: cargo +1.89.0 check --locked

  qemu:
    name: qemu (cortex-m4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Mirrors `rust-toolchain.toml`.
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: thumbv7em-none-eabihf

      - name: qemu-system-arm
        run: sudo apt-get update && sudo apt-get install -y qemu-system-arm

      # `firmware/` is its own workspace, and its `.cargo/config.toml` fixes the
      # target and the linker script, so the build runs from inside it.
      - name: build (firmware)
        working-directory: firmware
        run: cargo build --release

      # The assertion, not just the compile: a failing check panics and exits 1.
      - name: run under QEMU
        working-directory: firmware
        run: |
          qemu-system-arm -M mps2-an386 -cpu cortex-m4 \
            -semihosting-config enable=on,target=native \
            -nographic \
            -kernel target/thumbv7em-none-eabihf/release/cyberspine-firmware
