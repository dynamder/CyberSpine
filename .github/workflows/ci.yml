name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: thumbv7em-none-eabihf

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --no-deps -- -D warnings

      # The reason the split exists: the portable crates must be usable on a
      # microcontroller. `cargo test` compiles them for the host, where a stray
      # `std` call would still build, so this is the only check that notices.
      - name: no_std (cyberspine-isa, thumbv7em)
        run: cargo check -p cyberspine-isa --target thumbv7em-none-eabihf

      - name: no_std (cyberspine-core, thumbv7em)
        run: cargo check -p cyberspine-core --target thumbv7em-none-eabihf

      # `fuzz/` is its own workspace and is not covered by `--workspace`.
      - name: test (all platforms)
        run: cargo test --workspace --all-targets

  qemu:
    name: qemu (cortex-m4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf

      - name: qemu-system-arm
        run: sudo apt-get update && sudo apt-get install -y qemu-system-arm

      # `firmware/` is its own workspace, and its `.cargo/config.toml` fixes the
      # target and the linker script, so the build runs from inside it.
      - name: build (firmware)
        working-directory: firmware
        run: cargo build --release

      # The assertion, not just the compile: a failing check panics and exits 1.
      - name: run under QEMU
        working-directory: firmware
        run: |
          qemu-system-arm -M mps2-an386 -cpu cortex-m4 \
            -semihosting-config enable=on,target=native \
            -nographic \
            -kernel target/thumbv7em-none-eabihf/release/cyberspine-firmware
