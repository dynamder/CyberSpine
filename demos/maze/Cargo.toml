[package]
name = "cyberspine-demo-maze"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license.workspace = true
publish = false

# The host: the action, the session and the viewer. It links the body for the
# default mode and opens the other two through `dylib:` / `rpc:`. The arbiter
# loop is `cyberspine-host`, the same one `cyinevm` uses.
[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
cyberspine-arbiter = { path = "../../crates/cyberspine-arbiter" }
cyberspine-asm = { path = "../../crates/cyberspine-asm" }
cyberspine-backend = { path = "../../crates/cyberspine-backend", features = ["dylib", "rpc"] }
cyberspine-core = { path = "../../crates/cyberspine-core" }
cyberspine-demo-maze-world = { path = "world" }
cyberspine-host = { path = "../../crates/cyberspine-host" }
cyberspine-manifest = { path = "../../crates/cyberspine-manifest" }
cyberspine-vm = { path = "../../crates/cyberspine-vm" }
thiserror = "2.0.21"

[dev-dependencies]
serde_json = "1"

[[bin]]
name = "maze"
path = "src/main.rs"
